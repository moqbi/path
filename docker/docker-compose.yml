# التشغيل المحلي كاملاً: قاعدة وخادم. الإنتاج على VPS بنفس الصورة.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: athar
      POSTGRES_USER: athar
      POSTGRES_DB: athar
    # لا منفذ مكشوف للعالم: القاعدة تُرى من الشبكة الداخلية وحدها.
    expose: ["5432"]
    volumes: ["db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U athar"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://athar:athar@db:5432/athar
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_BUCKET: ${R2_BUCKET}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      SENTRY_DSN: ${SENTRY_DSN}
      NODE_ENV: production
    ports: ["127.0.0.1:4000:4000"]
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped

volumes:
  db:
