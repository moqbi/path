# مخطط النشر على ريندر. موجود في المستودع حتى تكون البيئة قابلة لإعادة
# الإنشاء بدل أن تكون إعدادات مكتوبة بيد أحدهم في اللوحة مرة واحدة.
services:
  - type: web
    name: athar
    runtime: node
    region: frankfurt
    plan: free
    branch: main
    buildCommand: npm run render:build
    startCommand: npm run render:start
    healthCheckPath: /login
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: athar-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: NODE_VERSION
        value: "22"
      # تخزين الملفات في Cloudflare R2. تُضبط قيمها في لوحة ريندر لا هنا:
      # المستودع عام، والمفتاح السرّي لا يُكتب في ملف.
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false

databases:
  - name: athar-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
