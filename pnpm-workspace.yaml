# مساحات العمل. الويب الحالي (src/) خارجها عمداً: يبقى تطبيق Next واحداً
# يُبنى بـnpm على ريندر كما هو، حتى يكتمل الترحيل.
packages:
  - "apps/*"
  - "packages/*"

# حزمٌ يُسمح لها بتشغيل سكربتات التثبيت.
#
# pnpm 10 لا يشغّلها إلا بإذن، ويسقط البناء بـ`ERR_PNPM_IGNORED_BUILDS`
# على خادمٍ لا أحد فيه ليضغط «وافق». وهذه الخمس تحتاجها فعلاً: محرّكات
# Prisma تُنزَّل في التثبيت، وsharp ثنائيّه الأصليّ، وesbuild كذلك.
onlyBuiltDependencies:
  - "@prisma/engines"
  - prisma
  - esbuild
  - sharp
  - "@sentry/cli"
  - unrs-resolver
patchedDependencies:
  expo-router: patches/expo-router.patch

# ترقياتٌ أمنيّة لحزمٍ غير مباشرة داخل إصدارها الرئيسيّ نفسه (تدقيق أكتوبر).
# ما يحتاج إصداراً رئيسيّاً آخر لا يُفرض هنا: يُكسر أباه.
overrides:
  mysql2: ^3.23.1
  fast-uri: ^3.1.8
  source-map-js: ^1.2.2
  shell-quote: ^1.11.0
  postcss@8: ^8.5.23
