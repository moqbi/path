# تحديثُ الجوّال من GitHub Actions — بديلُ `.eas/workflows` حين تنفد دقائق EAS المجّانيّة.
# التحزيمُ هنا على خادم GitHub، وEAS يستقبل الحزمةَ وحدها فلا تُحسب من دقائقه.
#
# يُشغَّل باليد من تبويب Actions (والجوّالُ يكفي): اختر القناة ثمّ «Run workflow».
# والمفتاحُ `EXPO_TOKEN` سرٌّ في إعدادات المستودع لا في الملفّ. والمتغيّراتُ متغيّراتُ
# ملفّي `.eas/workflows` حرفاً بحرف — `production` بلا معرّف سناب ولا مفتاحٍ تجريبيّ
# (القاعدة ١٧٢)، ولا يُنشر إليه إلا بقرار المالك (القاعدة ٢٣٩).
name: OTA update

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "القناة"
        type: choice
        options: [production, development]
        default: production
      message:
        description: "وصف التحديث"
        type: string
        default: "تحديث"

concurrency:
  group: ota-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Publish
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_URL: https://atharmts.com
          EXPO_PUBLIC_SITE_URL: https://atharmts.com
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: 186550074028-pve7oubeech3slm7i02jgf48l9cboo3v.apps.googleusercontent.com
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: 186550074028-ndj4lmrokmnv02snc6luvbdfes68pm45.apps.googleusercontent.com
          EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: 186550074028-c8sechd2sqdoa849lbstjs82smlvlr0i.apps.googleusercontent.com
          EXPO_PUBLIC_RC_IOS_KEY: ${{ inputs.channel == 'production' && 'appl_kvEJJEfYfvzLeTiuyRCivnbNhJJ' || '' }}
          EXPO_PUBLIC_SNAP_CLIENT_ID: ${{ inputs.channel == 'development' && 'b3e81a2e-e14e-47c9-98f6-f82da9a433d2' || '' }}
          EXPO_PUBLIC_RC_TEST_KEY: ${{ inputs.channel == 'development' && 'test_bPkuVnVXLCekZPeJHkZQtHucNQi' || '' }}
          CHANNEL: ${{ inputs.channel }}
          MESSAGE: ${{ inputs.message }}
        run: eas update --branch "$CHANNEL" --platform ios --message "$MESSAGE" --non-interactive
